# Dependency policy for the complete lockfile, including optional OPC UA peers.
[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
# The production RustSec gate reports RSA 0.9 directly. The compatible fix
# starts at 0.10, and the pinned OPC UA client and crypto crates still require
# 0.9. Reassess this stack before releasing with the advisory outstanding.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "Unmaintained parser used by async-opcua's YAML helpers; OIP accepts typed JSON and constructs its OPC UA config in code; migrate the upstream dependency and review by 2027-02-03" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
