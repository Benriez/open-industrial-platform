[workspace]
members = [
    "crates/oip-core",
    "crates/oip-server",
    "crates/oip-agent",
    "crates/oip-gateway",
    "crates/oip-opcua",
    "crates/oip-simulator",
    "crates/oip-storage",
    "crates/oip-diagnostics",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# rusqlite 0.41 bundles SQLite 3.54.0 and closes RUSTSEC-2026-0459
# (CVE-2026-119375: uninitialized page-cache memory when a database is
# opened together with a sibling -wal file of a different page size).
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1"

# Maintained dependencies and the ActivateSession nonce backport. See vendor/README.md.
[patch.crates-io]
async-opcua-client = { path = "vendor/async-opcua-client" }
async-opcua-crypto = { path = "vendor/async-opcua-crypto" }
async-opcua-server = { path = "vendor/async-opcua-server" }
chrono = { path = "vendor/chrono" }
