const form = document.querySelector('#unlock');
const password = document.querySelector('#password');
const button = form.querySelector('button');
const message = document.querySelector('#message');
const bytes = base64 => Uint8Array.from(atob(base64), char => char.charCodeAt(0));

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (button.disabled) return;
  if (!globalThis.crypto?.subtle) {
    message.textContent = 'Öffne diese Seite über HTTPS oder als lokale HTML-Datei.';
    return;
  }
  button.disabled = true;
  message.textContent = 'Präsentation wird entschlüsselt …';
  try {
    const input = new TextEncoder().encode(password.value);
    const material = await crypto.subtle.importKey('raw', input, 'PBKDF2', false, ['deriveKey']);
    input.fill(0);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', hash: 'SHA-256', salt: bytes(encrypted.salt), iterations: encrypted.iterations},
      material, {name: 'AES-GCM', length: 256}, false, ['decrypt']
    );
    const content = await crypto.subtle.decrypt(
      {name: 'AES-GCM', iv: bytes(encrypted.iv)}, key, bytes(encrypted.data)
    );
    password.value = '';
    document.open();
    document.write(new TextDecoder().decode(content));
    document.close();
  } catch {
    message.textContent = 'Das Passwort stimmt nicht.';
    password.focus();
    password.select();
  } finally {
    button.disabled = false;
  }
});
</script>
