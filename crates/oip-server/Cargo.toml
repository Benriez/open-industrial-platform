[package]
name = "oip-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# rmcp 3.9 closes RUSTSEC-2026-0462 (unbounded response body buffering in
# the Streamable HTTP clients of the SDK).
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
base64 = "0.22"
code-server-license-verifier = { path = "../code-server-license-verifier" }
time = "0.3.44"
axum = "0.8.9"
flate2 = "1"
futures = "0.3"
hmac = "0.12"
oip-core = { path = "../oip-core", features = ["schemas"] }
oip-opcua = { path = "../oip-opcua" }
oip-simulator = { path = "../oip-simulator" }
oip-diagnostics = { path = "../oip-diagnostics" }
oip-storage = { path = "../oip-storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-util = { version="0.7", features=["rt"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

rusqlite.workspace = true

[dev-dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
jsonschema = { version = "0.46", default-features = false }

tower = { version = "0.5", features = ["util"] }

