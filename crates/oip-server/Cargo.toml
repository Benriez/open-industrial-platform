[package]
name = "oip-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
axum = "0.8.9"
futures = "0.3"
oip-core = { path = "../oip-core", features = ["schemas"] }
oip-opcua = { path = "../oip-opcua" }
oip-simulator = { path = "../oip-simulator" }
oip-storage = { path = "../oip-storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
jsonschema = { version = "0.46", default-features = false }

rusqlite.workspace = true
tower = { version = "0.5", features = ["util"] }

