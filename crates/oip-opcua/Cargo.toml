[package]
name = "oip-opcua"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["async-opcua-backend"]
async-opcua-backend = ["dep:async-opcua"]
open62541-backend = ["dep:open62541", "dep:open62541-sys"]

[dependencies]
async-trait = "0.1"
async-opcua = { version = "=0.19.0", features = ["client", "server"], optional = true }
chrono = "0.4"
futures = "0.3"
oip-core = { path = "../oip-core" }
oip-simulator = { path = "../oip-simulator" }
open62541 = { version = "=0.12.1", optional = true }
open62541-sys = { version = "=0.6.6", optional = true }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "oip-open62541-poc"
path = "src/bin/oip-open62541-poc.rs"
required-features = ["open62541-backend"]

[[bin]]
name = "oip-async-opcua-poc"
path = "src/bin/oip-async-opcua-poc.rs"
required-features = ["async-opcua-backend"]

[[bin]]
name = "oip-simulated-server"
path = "src/bin/oip-simulated-server.rs"
required-features = ["async-opcua-backend"]

[[bin]]
name = "oip-test-client"
path = "src/bin/oip-test-client.rs"
required-features = ["async-opcua-backend"]
