<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Open Industrial Platform — lokale, autorisierte Infrastruktur und nachvollziehbare Diagnostik.">
  <meta name="theme-color" content="#0b1723">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=43">
  <link rel="manifest" href="manifest.json">
  <title>Open Industrial Platform</title>
  <style>
    body { margin: 0; background: #0b1723; color: #e9f2f7; }
    #loading { display: flex; align-items: center; gap: 8px; padding: 40px; font: 14px system-ui; }
    /* Flutter owns scrolling inside the view. Keep its accessibility
       scroll targets from extending the browser document. */
    flutter-view { touch-action: manipulation; overflow: clip; }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <img src="icons/Icon-192.png" width="40" height="40" alt="">
    <span id="loading-text">Open Industrial Platform · wird geladen …</span>
  </div>
  <script>
    try {
      if (JSON.parse(localStorage.getItem('flutter.oip-language')) === 'en') {
        document.documentElement.lang = 'en';
        document.getElementById('loading-text').textContent = 'Open Industrial Platform · loading …';
      }
    } catch (_) {
      // The default language is available even when storage is disabled.
    }
    // CanvasKit is packaged locally; the application has no runtime CDN dependency.
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
