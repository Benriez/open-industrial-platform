name: macOS OTA release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install pinned Flutter SDK
        env:
          FLUTTER_VERSION: 3.22.0
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build direct macOS app
        working-directory: apps/flutter
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          BUILD=$((RUN_NUMBER + 3))
          flutter build macos --release \
            --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define=OIP_API_URL=http://127.0.0.1:18857 \
            --dart-define=OIP_APP_VERSION="$VERSION" \
            --dart-define=OIP_APP_BUILD="$BUILD"
          echo "OIP_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Create signed OTA bundle
        env:
          OIP_OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OIP_OTA_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$OIP_OTA_SIGNING_PRIVATE_KEY"
          python3 tools/oip_github_ota_package.py \
            --bundle apps/flutter/build/macos/Build/Products/Release/oip_dashboard.app \
            --out target/oip-github-ota-release \
            --build "$OIP_BUILD"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            target/oip-github-ota-release/oip-macos-universal.zip \
            target/oip-github-ota-release/oip-macos-manifest.json \
            target/oip-github-ota-release/oip-macos-manifest.json.sig \
            --title "Open Industrial Platform ${RELEASE_TAG#v}" \
            --generate-notes
